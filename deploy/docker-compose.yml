# =============================================================
# 螃蟹小公主 · 鄱阳湖湖蟹 多端平台 一键编排（PRO.md 6.3）
# 服务清单：mysql8 / redis / rabbitmq / minio / app-backend
#          / app-admin / app-h5 / app-static / mysql-backup / nginx
# 用法：cp .env.example .env && docker compose up -d
# =============================================================
name: poyang-crab

services:
  mysql8:
    image: mysql:8.0
    container_name: crab-mysql
    restart: always
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=500
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行建表与初始化数据（T02/T03）
      - ../sql/00_create_database.sql:/docker-entrypoint-initdb.d/00_create_database.sql:ro
      - ../sql/01_system.sql:/docker-entrypoint-initdb.d/01_system.sql:ro
      - ../sql/02_member_product.sql:/docker-entrypoint-initdb.d/02_member_product.sql:ro
      - ../sql/03_order.sql:/docker-entrypoint-initdb.d/03_order.sql:ro
      - ../sql/04_channel.sql:/docker-entrypoint-initdb.d/04_channel.sql:ro
      - ../sql/05_cms.sql:/docker-entrypoint-initdb.d/05_cms.sql:ro
      - ../sql/99_init_data.sql:/docker-entrypoint-initdb.d/99_init_data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [crab-net]

  redis:
    image: redis:7-alpine
    container_name: crab-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks: [crab-net]

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: crab-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${MQ_USER}
      RABBITMQ_DEFAULT_PASS: ${MQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${MQ_VHOST}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [crab-net]

  minio:
    image: minio/minio:latest
    container_name: crab-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks: [crab-net]

  # 初始化 bucket（MinIO 驱动默认存储桶）
  minio-init:
    image: minio/mc:latest
    container_name: crab-minio-init
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until (mc alias set crab http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}) do sleep 2; done;
      mc mb -p crab/${MINIO_BUCKET} || true;
      mc anonymous set download crab/${MINIO_BUCKET} || true;
      echo 'MinIO bucket ready';
      "
    networks: [crab-net]

  app-backend:
    build:
      context: ../poyang-crab-backend
      dockerfile: Dockerfile
    container_name: crab-backend
    restart: always
    depends_on:
      mysql8:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MQ_USER: ${MQ_USER}
      MQ_PASSWORD: ${MQ_PASSWORD}
      CRAB_JWT_SECRET: ${CRAB_JWT_SECRET}
      WX_MP_APPID: ${WX_MP_APPID}
      WX_MP_SECRET: ${WX_MP_SECRET}
      WX_MINI_APPID: ${WX_MINI_APPID}
      WX_MINI_SECRET: ${WX_MINI_SECRET}
      WX_PAY_MCHID: ${WX_PAY_MCHID}
      WX_PAY_APIV3KEY: ${WX_PAY_APIV3KEY}
      SF_PARTNER_ID: ${SF_PARTNER_ID}
      SF_CHECK_WORD: ${SF_CHECK_WORD}
      TZ: Asia/Shanghai
    ports:
      - "${BACKEND_PORT}:8080"
    volumes:
      - backend-logs:/app/logs
      - upload-data:/data/upload
    networks: [crab-net]

  app-admin:
    image: nginx:1.27-alpine
    container_name: crab-admin
    restart: always
    depends_on: [app-backend]
    ports:
      - "${ADMIN_PORT}:80"
    volumes:
      - ../poyang-crab-admin/dist:/usr/share/nginx/html:ro
      - ./nginx/conf.d/admin.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [crab-net]

  app-h5:
    image: nginx:1.27-alpine
    container_name: crab-h5
    restart: always
    depends_on: [app-backend]
    ports:
      - "${H5_PORT}:80"
    volumes:
      - ../poyang-crab-h5/dist:/usr/share/nginx/html:ro
      - ./nginx/conf.d/h5.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [crab-net]

  # 小程序构建产物托管（体验版/正式版包下载，机构内部分发）
  app-static:
    image: nginx:1.27-alpine
    container_name: crab-static
    restart: always
    volumes:
      - ../poyang-crab-miniapp/dist:/usr/share/nginx/html/miniapp:ro
      - ../poyang-crab-channel/dist:/usr/share/nginx/html/channel:ro
      - ./nginx/conf.d/static.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [crab-net]

  # T04 每日全量备份，保留 14 份
  mysql-backup:
    image: mysql:8.0
    container_name: crab-mysql-backup
    restart: always
    depends_on:
      mysql8:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql8
      MYSQL_USER: root
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      BACKUP_KEEP: "14"
      TZ: Asia/Shanghai
    volumes:
      - ./backup/backup-mysql.sh:/usr/local/bin/backup-mysql.sh:ro
      - backup-data:/backup
    entrypoint: ["/bin/bash", "-c", "chmod +x /usr/local/bin/backup-mysql.sh && while true; do /usr/local/bin/backup-mysql.sh; sleep 86400; done"]
    networks: [crab-net]

  # 反向代理：PC 官网 / API / HTTPS 入口
  nginx:
    image: nginx:1.27-alpine
    container_name: crab-nginx
    restart: always
    depends_on: [app-backend, app-h5, app-admin]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - upload-data:/usr/share/nginx/files:ro
    networks: [crab-net]

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  backup-data:
  backend-logs:
  upload-data:

networks:
  crab-net:
    driver: bridge
