# =============================================================
# PC 品牌官网 + API 统一入口（xiegongzhu.com）
# HTTPS 全站（PRO.md 6.2 / checklist 第九项）
# 证书挂载：deploy/nginx/certs/{fullchain.pem,privkey.pem}
# =============================================================

# HTTP -> HTTPS 跳转
server {
    listen 80;
    server_name xiegongzhu.com www.xiegongzhu.com;

    # ACME 校验目录
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name xiegongzhu.com www.xiegongzhu.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # PC 官网（H5 工程同时作为官网静态站构建产物）
    root /usr/share/nginx/html;
    index index.html;

    # 对象存储本地驱动静态文件
    location /files/ {
        alias /usr/share/nginx/files/;
        expires 7d;
    }

    location /api/ {
        proxy_pass http://app-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 200m;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
