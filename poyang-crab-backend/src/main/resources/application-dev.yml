spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # T04 HikariCP 连接池：上限 50 / 连接超时 30s / 空闲回收 60s
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 60000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      pool-name: PoyangCrabHikariPool
    # 读写分离开关：默认关闭（后台可开启，见 sys_config: datasource.read-write-split）
    url: jdbc:mysql://172.16.28.248:3306/poyang_crab?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: poyang_crab
    password: BZcEXmWxiDcmx5bw
    # 从库（读写分离开启时启用）
    slave:
      enabled: false
      url: jdbc:mysql://172.16.28.248:3306/poyang_crab?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
      username: poyang_crab
      password: BZcEXmWxiDcmx5bw

  data:
    redis:
      host: 172.16.28.201
      port: 6379
      password: ${REDIS_PASSWORD:RUiTMHWVr5cdoAPg}
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-idle: 20
          min-idle: 5
          max-active: 100
          max-wait: 5s

  rabbitmq:
    host: 172.16.28.201
    port: 5672
    virtual-host: /
    username: aicadmin
    password: admin9695
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        prefetch: 10
        concurrency: 2
        max-concurrency: 8
        acknowledge-mode: manual
        retry:
          enabled: true
          max-attempts: 3

logging:
  level:
    com.xiegongzhu.crab: debug
    org.springframework.amqp: info
  file:
    name: ./logs/poyang-crab-backend.log

crab:
  order:
    expire-minutes: 30
  jwt:
    # 生产必须通过环境变量 CRAB_JWT_SECRET 覆盖
    secret: ${CRAB_JWT_SECRET:xyGz-poyang-crab-2026-please-change-me-32bytes}
    expire-hours: 24
  storage:
    local:
      base-path: ./data/upload
      domain: http://crab.xiegongzhu.com/api/files
  wechat:
    mp:
      appid: ${WX_MP_APPID:}
      secret: ${WX_MP_SECRET:}
    mini:
      appid: ${WX_MINI_APPID:}
      secret: ${WX_MINI_SECRET:}
    pay:
      mchid: ${WX_PAY_MCHID:}
      apiv3-key: ${WX_PAY_APIV3KEY:}
      notify-url: http://crab.xiegongzhu.com/api/pay/notify/wechat