server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: poyang-crab-backend
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  messages:
    basename: i18n/messages
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.xiegongzhu.crab.module.**.entity
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      table-underline: true
  configuration:
    map-underscore-to-camel-case: true
    # 注意：不要用 StdOutImpl（直写 System.out）。当进程的 stdout 无人消费（后台窗口/缓冲满）时，
    # 写 stdout 会阻塞并持有 PrintStream 锁，进而拖死整个 Tomcat 线程池（本机已踩过）。
    # 改用 Slf4jImpl，由 logback 统一输出，dev 下 SQL 仍可见（见 application-dev.yml 的日志级别）。
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 业务可配置项默认值（正式以 sys_config 为准，此处仅兜底）
crab:
  order:
    expire-minutes: 30
  jwt:
    # 生产必须通过环境变量 CRAB_JWT_SECRET 覆盖
    secret: ${CRAB_JWT_SECRET:xyGz-poyang-crab-2026-please-change-me-32bytes}
    expire-hours: 24
  storage:
    local:
      base-path: ./data/upload
      domain: http://localhost:8080/api/files
  wechat:
    mp:
      appid: ${WX_MP_APPID:}
      secret: ${WX_MP_SECRET:}
    mini:
      appid: ${WX_MINI_APPID:}
      secret: ${WX_MINI_SECRET:}
    pay:
      mchid: ${WX_PAY_MCHID:}
      apiv3-key: ${WX_PAY_APIV3KEY:}
      notify-url: http://localhost:8080/api/pay/notify/wechat
  sf:
    # 顺丰冷链（丰桥开放平台）
    partner-id: ${SF_PARTNER_ID:}
    check-word: ${SF_CHECK_WORD:}
    endpoint: https://sfapi.sf-express.com

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
