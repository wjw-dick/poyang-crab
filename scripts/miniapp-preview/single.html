<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>小程序预览 · 独立窗口</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="single">
  <div class="topbar">
    <h1 id="single-title">小程序预览</h1>
    <span class="hint">独立窗口视图，适合逐页查看 / 截图</span>
    <span class="spacer"></span>
    <a class="mini-btn" id="back-to-index" href="index.html">返回双端视图</a>
    <a class="mini-btn" id="open-miniapp" href="single.html?app=miniapp">C 端</a>
    <a class="mini-btn" id="open-channel" href="single.html?app=channel">渠道商端</a>
  </div>
  <div id="stage-root"></div>

  <script src="runtime.js"></script>
  <script src="ui.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search)
      var key = params.get('app') === 'channel' ? 'channel' : 'miniapp'
      document.getElementById('single-title').textContent =
        key === 'channel' ? '渠道商端小程序 · 浏览器预览' : 'C 端小程序 · 浏览器预览'
      document.title = document.getElementById('single-title').textContent
      document.documentElement.style.setProperty('--scale', '1')
      MiniPreviewUI.mount(document.getElementById('stage-root'), [key])
    })()
  </script>
</body>
</html>
